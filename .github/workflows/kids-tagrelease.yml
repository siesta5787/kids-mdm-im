name: Kids Tag Release

# Tags the head of main as vX.YY and builds/publishes it. The Android versionCode is derived
# from the tag (see build-logic/plugins/src/main/java/kidsmdm-app.gradle.kts), so no
# version-bump commit is needed.
#
#   gh workflow run kids-tagrelease.yml -R siesta5787/kids-mdm-im -f version=0.07

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the leading "v", e.g. 0.07'
        required: true

permissions:
  contents: write

jobs:
  push_tag:
    name: Push version tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - name: Tag main and push
        id: tag
        run: |
          version="${{ github.event.inputs.version }}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]{2}$ ]]; then
            echo "::error::Version must look like 0.07 or 1.00 (got '$version')"
            exit 1
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi
          git tag "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: push_tag
    uses: ./.github/workflows/kids-release.yml
    with:
      version: ${{ needs.push_tag.outputs.tag }}
    secrets: inherit
