name: Kids Tag Release

# Tags the head of main as vX.YY and builds it as a beta release (see kids-release.yml).
# Leave the version empty to use the next one after the highest existing vX.YY tag. The Android
# versionCode is derived from the tag (build-logic/plugins/src/main/java/kidsmdm-app.gradle.kts),
# so no version-bump commit is needed. kids-sync.yml calls this after every Signal merge.
#
#   gh workflow run kids-tagrelease.yml -R siesta5787/kids-mdm-im            # next version
#   gh workflow run kids-tagrelease.yml -R siesta5787/kids-mdm-im -f version=1.00

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the leading "v" (e.g. 0.07). Empty = next version.'
        required: false
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  push_tag:
    name: Push version tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          lfs: false
          # The built-in token on purpose: a tag it pushes doesn't trigger kids-release's own
          # tag-push trigger, so the explicit call below is the only release build.
          token: ${{ github.token }}

      - name: Tag main and push
        id: tag
        run: |
          version="${INPUT_VERSION#v}"
          if [ -z "$version" ]; then
            # Only our own vX.YY tags; Molly/Signal-era v8.x.y tags never match this pattern.
            last=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]{2}$' | sort -V | tail -1)
            last=${last:-v0.00}
            major=${last#v}; minor=${major#*.}; major=${major%.*}
            minor=$((10#$minor + 1))
            if [ "$minor" -ge 100 ]; then major=$((major + 1)); minor=0; fi
            version=$(printf '%d.%02d' "$major" "$minor")
            echo "Last release $last, next $version"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]{2}$ ]]; then
            echo "::error::Version must look like 0.07 or 1.00 (got '$version')"
            exit 1
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi
          git tag "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}

  release:
    name: Release
    needs: push_tag
    uses: ./.github/workflows/kids-release.yml
    with:
      version: ${{ needs.push_tag.outputs.tag }}
    secrets: inherit
