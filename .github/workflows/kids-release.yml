name: Kids Release

# Builds a signed kidsProdRelease APK for an existing vX.YY tag and publishes it as a GitHub
# **prerelease** (the beta channel). Nothing reaches the kids' phones until the release is
# promoted with kids-promote.yml, which just clears the prerelease flag on this same release, so
# stable phones get exactly the APK that was tested on beta.
#
# kid-phone-server installs the first .apk asset of the newest matching release; its catalog has
# a "beta" entry (include prereleases) for the test phone and a "stable" entry (no prereleases)
# for the kids' phones. Normally started by kids-tagrelease.yml.

on:
  # A pushed vX.YY tag (e.g. v0.07) builds and publishes a beta. Tag pushes work from any branch,
  # unlike workflow_dispatch, which needs the workflow on the default branch.
  push:
    tags:
      - 'v[0-9]+.[0-9][0-9]'
  workflow_call:
    inputs:
      version:
        description: 'Tag to release, e.g. v0.07'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag to (re)build, e.g. v0.07'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build
    uses: ./.github/workflows/kids-build-apk.yml
    with:
      ref: ${{ inputs.version || github.ref_name }}
      version: ${{ inputs.version || github.ref_name }}
      apk_name: KidsMDMIM-${{ inputs.version || github.ref_name }}.apk
    secrets: inherit

  publish:
    name: Publish to beta
    runs-on: ubuntu-24.04
    needs: build
    env:
      TAG_REF: ${{ inputs.version || github.ref_name }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version || github.ref_name }}
          lfs: false

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - name: Check version code is newer than the latest release
        run: |
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          version_code() { "$aapt" d badging "$1" | sed -n "s/^package:.*versionCode='\([0-9]*\)'.*/\1/p"; }
          build_code=$(version_code dist/*.apk)
          echo "Build version code: $build_code"
          # Compare against the newest release of any kind (beta or stable), excluding this tag.
          latest=$(gh release list --exclude-drafts --limit 20 --json tagName -q '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]{2}$' | grep -vx "$TAG_REF" | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then
            mkdir -p latest
            gh release download "$latest" --pattern '*.apk' --dir latest
            latest_code=$(version_code latest/*.apk)
            echo "Newest other release $latest has version code $latest_code"
            if [ "$build_code" -le "$latest_code" ]; then
              echo "::error::Version code $build_code is not greater than $latest's $latest_code"
              exit 1
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update the beta release
        run: |
          if ! gh release view "$TAG_REF" >/dev/null 2>&1; then
            gh release create "$TAG_REF" --verify-tag --prerelease --latest=false \
              --title "$TAG_REF (beta)" \
              --notes "Beta build of Kids MDM IM $TAG_REF. Promote with kids-promote.yml once it's been tested on the beta phone."
          fi
          gh release upload "$TAG_REF" dist/*.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_PAT || secrets.GITHUB_TOKEN }}
