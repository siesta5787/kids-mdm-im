name: Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: write # create/upload GitHub Releases with the default token

env:
  TAG_REF: "${{ inputs.version || github.ref_name }}"
  HAVE_KEYSTORE: ${{ secrets.SECRET_KEYSTORE != '' }}

jobs:
  build:
    name: Build
    if: "github.event.base_ref != 'refs/heads/upstream-main'"
    runs-on: ubuntu-24.04
    # KIDS MDM IM: explicit generous timeout to rule out a hidden default
    # being the cause of three consecutive builds getting externally
    # killed at almost the exact same ~7m30s-7m55s mark regardless of
    # workload changes (disk space was confirmed fine: 103GB free).
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6
        with:
          ref: "${{ env.TAG_REF }}"

      - name: Free up disk space in runner
        uses: ./.github/actions/disk-cleanup

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # KIDS MDM IM: build directly with Gradle on the runner instead of
      # inside Molly's reproducible-builds Docker container. That Docker
      # setup exists so third parties can verify a release APK matches
      # this source bit-for-bit — a guarantee we don't need for a fork
      # that isn't publicly distributed for independent verification.
      # It also has no build/compile cache (only a read-only dependency
      # cache), so every release rebuilt the entire codebase from a cold
      # cache every time. Building directly here lets this cache
      # read/write normally, same as test.yml.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Extract signing keys
        if: "env.HAVE_KEYSTORE == 'true'"
        run: printenv KEYSTORE | base64 -d > "${{ github.workspace }}/release-keystore.jks"
        env:
          KEYSTORE: ${{ secrets.SECRET_KEYSTORE }}

      # Only assembleRelease (APK) — bundleRelease (AAB) is a Play Store
      # publishing format nothing in this pipeline consumes.
      #
      # Confirmed by direct memory monitoring (not a guess): this is a
      # genuine OOM. RAM (15GB) climbs steadily to full, then swap (3GB)
      # also fills completely, the system thrashes for minutes, and the
      # runner is killed externally ("shutdown signal") once it stops
      # responding. --max-workers=2 + skipping lintVital reduced but
      # didn't fix it. Going fully serial (--max-workers=1) plus an
      # explicit heap cap on the Gradle daemon keeps peak concurrent
      # memory (Gradle daemon + R8's own forked JVM + Kotlin daemon)
      # well under the ceiling instead of each JVM claiming its own
      # RAM-fraction default. Slower wall-clock than parallel, but still
      # far faster than the Docker pipeline's cold ~50min builds, and
      # unlike parallel, actually completes.
      - name: Build APK
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> "$GRADLE_USER_HOME/gradle.properties"
          ( while true; do echo "--- MEMWATCH $(date -u +%H:%M:%S) ---"; free -h; sleep 15; done ) &
          MONITOR_PID=$!
          ./gradlew -PCI=true --max-workers=1 -Pandroid.lint.checkReleaseBuilds=false :app:assembleRelease
          kill "$MONITOR_PID" 2>/dev/null || true
        env:
          CI_APP_TITLE: ${{ vars.CI_APP_TITLE }}
          CI_APP_FILENAME: ${{ vars.CI_APP_FILENAME }}
          CI_PACKAGE_ID: ${{ vars.CI_PACKAGE_ID }}
          CI_BUILD_VARIANTS: ${{ vars.CI_BUILD_VARIANTS }}
          CI_FORCE_INTERNAL_USER_FLAG: ${{ vars.CI_FORCE_INTERNAL_USER_FLAG }}
          CI_KEYSTORE_PATH: ${{ env.HAVE_KEYSTORE == 'true' && format('{0}/release-keystore.jks', github.workspace) || '' }}
          CI_KEYSTORE_ALIAS: ${{ secrets.SECRET_KEYSTORE_ALIAS }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.SECRET_KEYSTORE_PASSWORD }}

      - name: Clean up keystore
        if: "always()"
        run: rm -f "${{ github.workspace }}/release-keystore.jks"

      - name: Log APK checksums
        run: find app/build/outputs -name "*.apk" -exec sha256sum '{}' +

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

  prepare_release:
    name: Prepare release
    if: "github.event.base_ref != 'refs/heads/upstream-main'"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          ref: "${{ env.TAG_REF }}"

      - name: Check if release exists
        id: check_release
        run: |
          if gh release view "$TAG_REF"; then
            echo "release_exists=true" >> $GITHUB_OUTPUT
          else
            echo "release_exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release draft
        if: "steps.check_release.outputs.release_exists == 'false'"
        run: gh release create -d --verify-tag -t "$TAG_REF" "$TAG_REF"
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_PAT || secrets.GITHUB_TOKEN }}

  upload:
    name: Upload
    runs-on: ubuntu-24.04
    needs:
      - build
      - prepare_release

    steps:
      - uses: actions/checkout@v6
        with:
          ref: "${{ env.TAG_REF }}"

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Check version for upgrade compatibility
        run: |
          echo "Listing latest APKs"
          gh release list --exclude-drafts --limit 10
          gh release download --pattern '*.apk' --dir latest || exit 0
          latest_apks=(latest/*.apk)
          build_apks=(apk/*/release/*.apk)
          aapt=($ANDROID_HOME/build-tools/*/aapt)
          version_code() {
            $aapt d badging "$1" | gawk 'match($0, /^package:.*versionCode=.([0-9]+)/, v) {print v[1]}'
          }
          echo "Using aapt: $aapt"
          latest_version_code=$(version_code "$latest_apks")
          build_version_code=$(version_code "$build_apks")
          echo "Latest version code: $latest_version_code"
          echo "Build version code: $build_version_code"
          if [ "$build_version_code" -le "$latest_version_code" ]; then
            echo "Build version code must be greater than the latest version code" >&2
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APKs to GitHub release
        run: gh release upload "$TAG_REF" ./apk/*/release/*.apk --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_PAT || secrets.GITHUB_TOKEN }}

      - name: Publish release
        run: gh release edit "$TAG_REF" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_PAT || secrets.GITHUB_TOKEN }}
