name: Tag Commit for Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, without the leading "v" (e.g. 0.02)'
        required: true

permissions:
  contents: write

jobs:
  push_tag:
    name: Push version tag
    runs-on: ubuntu-24.04
    outputs:
      version: v${{ github.event.inputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Bump hotfix version for Android versionCode
        # Our release tags (v0.01, v0.02, ...) are independent of Molly's
        # own versionName/versionCode scheme, so two releases cut without
        # an intervening upstream sync would otherwise share the same
        # versionCode and fail Android's monotonic-upgrade requirement.
        # currentHotfixVersion exists upstream for exactly this: bumping
        # it on every release keeps versionCode strictly increasing
        # without needing a new canonicalVersionCode/mollyRevision.
        run: |
          current=$(grep -oP '(?<=val currentHotfixVersion = )[0-9]+' app/build.gradle.kts)
          next=$((current + 1))
          sed -i "s/val currentHotfixVersion = $current/val currentHotfixVersion = $next/" app/build.gradle.kts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump hotfix version to $next for v${{ github.event.inputs.version }}"
          git push origin HEAD:main

      - name: Tag current commit and push
        run: |
          git tag "v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"

  call_release_workflow:
    name: Release workflow
    needs: push_tag
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.push_tag.outputs.version }}
    secrets: inherit
